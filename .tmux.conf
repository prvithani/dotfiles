set -g mouse on
set -g pane-border-status bottom

# Palette: Catppuccin Macchiato (hex, no plugin)
set -as terminal-features ",*:RGB"

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#1e2030,fg=#cad3f5"
set -g status-left-length 40
set -g status-left "#[bg=#8aadf4,fg=#1e2030,bold] #S #[default] "
set -g status-right-length 100
set -g status-right "#{?client_prefix,#[fg=#f5a97f bold]PREFIX  ,}#{?#{==:#{pane_mode},copy-mode},#[fg=#eed49f bold]COPY  ,}#[fg=#8aadf4]#{=/-40/…:#{s|^/root|~|:pane_current_path}}  #[fg=#6e738d]#H  #[fg=#cad3f5]%a %d %b %H:%M "

# Window tabs
set -g window-status-separator ""
set -g window-status-style "fg=#6e738d"
# Claude state per pane (set by ~/.claude/hooks/tmux-state.sh): ◆ waiting, ● working, ○ done
set -g @claude_glyph "#{?#{==:#{@claude_state},waiting},#[fg=#f5a97f]◆ ,#{?#{==:#{@claude_state},working},#[fg=#a6da95]● ,#{?#{==:#{@claude_state},done},#[fg=#6e738d]○ ,}}}"
# Most urgent Claude state among the window's panes
set -g @claude_tab "#{?#{m:*waiting*,#{P:#{@claude_state} }}, #[fg=#f5a97f]◆,#{?#{m:*working*,#{P:#{@claude_state} }}, #[fg=#a6da95]●,#{?#{m:*done*,#{P:#{@claude_state} }}, ○,}}}"
set -g window-status-format " #I:#W#{?window_zoomed_flag, [Z],}#{E:@claude_tab} "
set -g window-status-current-format "#[bg=#363a4f,fg=#c6a0f6,bold] #I:#W#{?window_zoomed_flag, [Z],}#{E:@claude_tab} "
set -g monitor-activity off
set -g window-status-activity-style "fg=#f5a97f"
set -g window-status-bell-style "fg=#ed8796,bold"

# Panes
set -g pane-border-lines heavy
set -g pane-border-style "fg=#363a4f"
set -g pane-active-border-style "fg=#8aadf4"
set -g pane-border-format "#{?pane_active,#[fg=#8aadf4 bold],#[fg=#6e738d]} #P #{E:@claude_glyph}#{?#{==:#{pane_current_command},claude},claude: #{s/^[^ ]+ //:pane_title},#{pane_current_command}} "

# Prompts, copy mode, clock
set -g message-style "bg=#363a4f,fg=#cad3f5"
set -g message-command-style "bg=#363a4f,fg=#c6a0f6"
set -g mode-style "bg=#494d64,fg=#cad3f5"
set -g clock-mode-colour "#8aadf4"
set -g display-panes-active-colour "#8aadf4"
set -g display-panes-colour "#6e738d"

# Window picker shows each Claude pane's title and state
bind w choose-tree -Zw -F "#{?pane_format,#{?#{==:#{pane_current_command},claude},#{pane_title}#{?#{@claude_state}, [#{@claude_state}],},#{pane_current_command}},#{?window_format,#{window_name}#{window_flags},#{session_windows} windows}}"

# Shift+Enter reaches Claude as a newline when the outer terminal supports it
set -s extended-keys on
set -as terminal-features "xterm*:extkeys"
set -s focus-events on

# Splits and new windows open in the current folder
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
run-shell "tmux list-keys | grep -E 'split-window -[hv] }' | sed -E 's/split-window -([hv]) }/split-window -\\1 -c \"##{pane_current_path}\" }/g' | tmux source-file -"

# Copy mode: evil-style selection
set -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# Reload config
bind r source-file ~/.tmux.conf \; display "reloaded"
